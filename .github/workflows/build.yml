name: build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*", "Climax_Game_Engine_Toolkit_v*" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-latest
          - name: macos-x64
            os: macos-13
          - name: windows-x64
            os: windows-latest
          - name: windows-arm64
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      # ── Dependencies ────────────────────────────────────────────────────────
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libsdl2-dev libglew-dev libglm-dev \
            libgl1-mesa-dev zlib1g-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install sdl2 glew glm

      # ── Configure + build ───────────────────────────────────────────────────
      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            if [ "${{ matrix.name }}" = "windows-arm64" ]; then
              EXTRA="-A ARM64 -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=arm64-windows"
            else
              EXTRA="-A x64 -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows"
            fi
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release $EXTRA

      - name: Build
        run: cmake --build build --config Release --parallel

      # ── Smoke test ──────────────────────────────────────────────────────────
      - name: Smoke test (Linux)
        run: |
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            timeout 10s ./build/ClimaxGameEngineToolkit 2> stderr.txt || true
          echo "--- stderr ---"; cat stderr.txt
          if grep -qiE "failed|\[shader\]" stderr.txt; then
            echo "::error::viewer reported errors on startup"; exit 1
          fi
        if: runner.os == 'Linux'

      - name: Check binary exists (macOS / Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          test -d build/ClimaxGameEngineToolkit.app || test -f build/Release/ClimaxGameEngineToolkit.exe || test -f build/ClimaxGameEngineToolkit

      # ── Package Archive ─────────────────────────────────────────────────────
      - name: Package release archive
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp build/Release/*.exe build/Release/*.dll dist/ 2>/dev/null || true
            cp README.md LICENSE dist/
            cd dist && 7z a "../Climax_Game_Engine_Toolkit-${{ matrix.name }}.zip" *
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cmake --install build --prefix dist/
            cp README.md LICENSE dist/
            cd dist && tar -czf "../Climax_Game_Engine_Toolkit-${{ matrix.name }}.tar.gz" *
          else
            cp build/ClimaxGameEngineToolkit dist/
            cp README.md LICENSE dist/
            cd dist && tar -czf "../Climax_Game_Engine_Toolkit-${{ matrix.name }}.tar.gz" *
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Climax_Game_Engine_Toolkit-${{ matrix.name }}
          path: Climax_Game_Engine_Toolkit-*.*
          if-no-files-found: error

      - name: Publish Release Asset
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/Climax_Game_Engine_Toolkit_v')
        uses: softprops/action-gh-release@v2
        with:
          files: Climax_Game_Engine_Toolkit-*.*
          generate_release_notes: true

